<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="g-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="#f1f5f9" />
  <!-- Stand Clamp -->
  <rect x="94" y="60" width="12" height="30" rx="4" fill="#334155"/>
  <rect x="85" y="80" width="30" height="15" rx="4" fill="#1e293b"/>
  <!-- Lightbar Tube -->
  <rect x="25" y="55" width="150" height="14" rx="7" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Light Cone -->
  <polygon points="35,69 165,69 185,160 15,160" fill="url(#g-light)"/>
</svg>
